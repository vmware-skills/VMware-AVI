[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-avi"
version = "1.8.12"
description = "AVI (NSX Advanced Load Balancer) management and AKO Kubernetes operations tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wei Zhou", email = "wei-wz.zhou@broadcom.com" }]
dependencies = [
    "avisdk>=22.1,<31.0",
    "kubernetes>=28.0,<33.0",
    "pyaml>=24.0,<27.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "mcp[cli]>=1.10,<2.0",
    "vmware-policy>=1.11.0,<2.0",
]


[project.urls]
Homepage = "https://github.com/vmware-skills/VMware-AVI"
Repository = "https://github.com/vmware-skills/VMware-AVI"
Issues = "https://github.com/vmware-skills/VMware-AVI/issues"
Changelog = "https://github.com/vmware-skills/VMware-AVI/blob/main/RELEASE_NOTES.md"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
vmware-avi = "vmware_avi.cli:app"
vmware-avi-mcp = "vmware_avi.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["vmware_avi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require AVI Controller)",
    "capability: Capability evals — scored trends, not pass/fail gates. Excluded from the default run (they measure quality, so <100% is expected and must not read as a broken build). Run them with: pytest -m capability",
]
addopts = "-m 'not capability'"
